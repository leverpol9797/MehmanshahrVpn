# Packaging a split APK loads a lot of classes at once. 160m of metaspace
# made :app:packageDebug die with a bare "Metaspace" error, which reads
# like a code fault but is only the JVM running out of class metadata.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -XX:+UseSerialGC -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
org.gradle.parallel=false
org.gradle.workers.max=1
