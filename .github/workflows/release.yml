name: Windows and Android release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Read-only by default. Only the `publish` job widens this, and only for tag pushes, so a
# pull request or a branch build cannot write to the repository even if a step misbehaves.
permissions:
  contents: read

concurrency:
  # Two runs on the same ref would race over the same artifact name and the same release.
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Every third-party action below is pinned to an immutable commit SHA rather than a tag,
# because a tag can be moved to different code after review. See
# security-evidence/logs/phase12-actions-supply-chain.txt for what each one is, who
# publishes it, and why it is needed.
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      windows-signed: ${{ steps.signing-gate.outputs.signed }}
      publisher: ${{ steps.signing-gate.outputs.publisher }}
    steps:
      # actions/checkout v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          # Nothing in this workflow pushes, so leaving a credential in .git/config only
          # widens what a later step could do with it.
          persist-credentials: false
      # actions/setup-node v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
      # actions/setup-java v4.9.1
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android NDK
        shell: pwsh
        run: |
          $sdkManager = Get-ChildItem -Path @(
            (Join-Path $env:ANDROID_HOME 'cmdline-tools'),
            (Join-Path $env:ANDROID_SDK_ROOT 'cmdline-tools')
          ) -Filter 'sdkmanager.bat' -File -Recurse -ErrorAction SilentlyContinue |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $sdkManager) { throw 'Android sdkmanager.bat was not found on the hosted runner.' }
          & $sdkManager 'ndk;27.2.12479018'
      # dtolnay/rust-toolchain, head of the `stable` branch as of 2026-08-05.
      # `@stable` is a mutable branch ref, so the SHA is pinned and the toolchain is named
      # explicitly rather than inherited from whatever that branch defaults to later.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Install dependencies
        run: npm ci
      - name: Fetch and verify Aether core
        run: npm run fetch:core
      - name: Fetch and verify routing engine
        run: npm run fetch:routing
      - name: Test frontend
        run: npm test
      # Runs after the sidecars are fetched and before anything is built, because it is
      # what enforces the SHA-256 values this repository pins for both engine binaries.
      - name: Test Rust backend
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

      - name: Select Windows signing configuration
        id: signing
        shell: pwsh
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AETHON_SIGN_ACCOUNT: ${{ secrets.AETHON_SIGN_ACCOUNT }}
        run: |
          $available = [bool]$env:WINDOWS_CERT_PFX_BASE64 -or
                       ([bool]$env:AZURE_CLIENT_ID -and [bool]$env:AETHON_SIGN_ACCOUNT)
          "available=$($available.ToString().ToLowerInvariant())" | Add-Content $env:GITHUB_OUTPUT
          if ($available) {
            Write-Host 'Code-signing credentials are present: binaries and installers will be signed during bundling.'
          } else {
            Write-Host '::warning::No Windows code-signing credentials are configured. This build will be UNSIGNED and cannot be published as a release.'
          }

      - name: Build application and installers
        shell: pwsh
        env:
          # Pinned into the binary so the in-app updater refuses any installer that is not
          # signed by this publisher. Empty on an unsigned build, where the updater still
          # requires a valid trusted signature but does not require a specific signer.
          AETHON_UPDATE_PUBLISHER: ${{ secrets.WINDOWS_PUBLISHER_NAME }}
          AETHON_SIGN_SCRIPT: ${{ github.workspace }}/scripts/sign-windows.ps1
          AETHON_SIGN_METHOD: ${{ secrets.AETHON_SIGN_METHOD }}
          AETHON_SIGN_TIMESTAMP_URL: ${{ secrets.AETHON_SIGN_TIMESTAMP_URL }}
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AETHON_SIGN_ENDPOINT: ${{ secrets.AETHON_SIGN_ENDPOINT }}
          AETHON_SIGN_ACCOUNT: ${{ secrets.AETHON_SIGN_ACCOUNT }}
          AETHON_SIGN_CERT_PROFILE: ${{ secrets.AETHON_SIGN_CERT_PROFILE }}
        run: |
          if ('${{ steps.signing.outputs.available }}' -eq 'true') {
            # The overlay adds bundle.windows.signCommand, so the application binary is
            # signed before it is packed into the MSI and the NSIS installer, and the
            # installers are signed afterwards. Signing the finished installers alone would
            # leave an unsigned executable on disk after installation.
            npm run build -- --config src-tauri/tauri.signing.conf.json
          } else {
            npm run build
          }

      - name: Fetch verified Android native assets
        run: npm run fetch:android

      - name: Prepare Android signing key
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if (-not $env:ANDROID_KEYSTORE_BASE64) { throw 'ANDROID_KEYSTORE_BASE64 is not configured.' }
          New-Item -ItemType Directory -Force android/.android-signing | Out-Null
          [IO.File]::WriteAllBytes("android/.android-signing/firstham-aethergui.jks", [Convert]::FromBase64String($env:ANDROID_KEYSTORE_BASE64))

      - name: Build signed Android APKs
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          ANDROID_KEYSTORE_PATH: .android-signing/firstham-aethergui.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          Set-Location android
          ./gradlew.bat assembleRelease bundleRelease lintRelease

      - name: Remove the Android signing key from the workspace
        # `always()` so the key does not survive a failed Gradle run either. The runner is
        # ephemeral, but nothing after this point has any reason to be able to read it.
        if: always() && github.event_name != 'pull_request'
        shell: pwsh
        run: |
          if (Test-Path android/.android-signing) {
            Remove-Item -LiteralPath android/.android-signing -Recurse -Force
          }

      - name: Validate Android pull request build
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: |
          Set-Location android
          ./gradlew.bat assembleDebug lintDebug

      - name: Stage release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          New-Item -ItemType Directory -Force portable | Out-Null
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version

          # Named by exact version, and checked. A wildcard here would silently pick one of
          # several installers if a previous version's bundle were ever present in the target
          # directory - which is precisely how a stale, unreviewed executable gets published
          # under a new version's name. Copy-Item with several sources and one destination
          # path does not even fail; it just produces the wrong file.
          function Copy-Artifact {
            param([string]$Pattern, [string]$Destination)
            $found = @(Get-ChildItem -Path $Pattern -File -ErrorAction SilentlyContinue)
            if ($found.Count -ne 1) {
              throw "Expected exactly one build artifact matching $Pattern, found $($found.Count): $($found.Name -join ', ')"
            }
            Copy-Item -LiteralPath $found[0].FullName -Destination $Destination
          }
          Copy-Artifact "src-tauri/target/release/bundle/nsis/Aethon_${version}_x64-setup.exe" "release/Aethon-VPN-v${version}-Windows-x64-Installer.exe"
          Copy-Artifact "src-tauri/target/release/bundle/msi/Aethon_${version}_x64_en-US.msi" "release/Aethon-VPN-v${version}-Windows-x64.msi"
          Copy-Item src-tauri/target/release/aether-gui.exe "portable/Aethon.exe"
          Copy-Item src-tauri/binaries/aether-x86_64-pc-windows-msvc.exe portable/aether.exe
          Copy-Item src-tauri/binaries/xray-x86_64-pc-windows-msvc.exe portable/xray.exe
          Copy-Item src-tauri/binaries/wintun.dll portable/wintun.dll
          Copy-Item LICENSE,NOTICE.md,TRADEMARK.md,third-party/xray-LICENSE.txt,third-party/wintun-LICENSE.txt portable/
          if ('${{ steps.signing.outputs.available }}' -eq 'true') {
            & powershell -NoProfile -ExecutionPolicy Bypass -File $env:AETHON_SIGN_SCRIPT `
              "release/Aethon-VPN-v${version}-Windows-x64-Installer.exe" `
              "release/Aethon-VPN-v${version}-Windows-x64.msi" `
              "portable/Aethon.exe"
            if ($LASTEXITCODE -ne 0) { throw 'Signing finalized Windows artifacts failed.' }
          }
          Compress-Archive -Path portable/* -DestinationPath "release/Aethon-VPN-v${version}-Windows-x64-portable.zip" -Force
          Copy-Item android/app/build/outputs/apk/release/app-universal-release.apk "release/Aethon-VPN-v${version}-Android-Universal.apk"
          Copy-Item android/app/build/outputs/apk/release/app-armeabi-v7a-release.apk "release/Aethon-VPN-v${version}-Android-ARMv7.apk"
          Copy-Item android/app/build/outputs/apk/release/app-arm64-v8a-release.apk "release/Aethon-VPN-v${version}-Android-ARM64.apk"
          Copy-Item android/app/build/outputs/apk/release/app-x86_64-release.apk "release/Aethon-VPN-v${version}-Android-x86_64.apk"
          Copy-Item android/app/build/outputs/bundle/release/app-release.aab "release/Aethon-VPN-v${version}-Android-AAB.aab"

          # The file list is materialised before anything is written back into `release`.
          # Streaming Get-ChildItem straight into a loop that appends SHA256SUMS.txt to the
          # same directory can hash the checksum file while it is still being written.
          $artifacts = @(Get-ChildItem release -File | Sort-Object -Property Name)
          $lines = foreach ($artifact in $artifacts) {
            "$((Get-FileHash $artifact.FullName -Algorithm SHA256).Hash.ToLower())  $($artifact.Name)"
          }
          # LF, not CRLF. Set-Content writes CRLF on Windows, and `sha256sum -c` then treats
          # the carriage return as part of the filename and reports every line as missing -
          # so the checksum file we publish for users to verify with would not verify.
          # Written once here, then appended to below with the same convention.
          $sums = (Resolve-Path release).Path + [IO.Path]::DirectorySeparatorChar + "SHA256SUMS.txt"
          [IO.File]::WriteAllText($sums, ($lines -join "`n") + "`n", (New-Object Text.ASCIIEncoding))
          $bundle = "release/Aethon-VPN-v${version}-all-platforms.zip"
          Compress-Archive -Path ($artifacts.FullName + @($sums)) -DestinationPath $bundle
          $bundleHash = (Get-FileHash $bundle -Algorithm SHA256).Hash.ToLower()
          [IO.File]::AppendAllText($sums, "$bundleHash  $([System.IO.Path]::GetFileName($bundle))`n", (New-Object Text.ASCIIEncoding))
          $commit = (& git rev-parse HEAD).Trim()
          $manifest = @(Get-ChildItem release -File | Where-Object { $_.Name -ne 'AETHON_RELEASE_MANIFEST.json' } | Sort-Object Name | ForEach-Object {
            [ordered]@{ artifact = $_.Name; size = $_.Length; sha256 = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower() }
          })
          [ordered]@{ version = $version; build_commit = $commit; build_date = [DateTime]::UtcNow.ToString('o'); artifacts = $manifest } |
            ConvertTo-Json -Depth 4 | Set-Content release/AETHON_RELEASE_MANIFEST.json -Encoding utf8
          Get-Content $sums

      - name: Windows signing gate
        id: signing-gate
        # Blocking on a tag: the `publish` job below cannot run if this fails, so an
        # unsigned or wrongly signed build can never become a release. Reported but not
        # fatal on branch and pull request builds, so day-to-day CI still produces
        # artifacts without a certificate - those artifacts are not publishable.
        continue-on-error: ${{ !startsWith(github.ref, 'refs/tags/') }}
        shell: pwsh
        env:
          WINDOWS_CERT_SUBJECT: ${{ secrets.WINDOWS_CERT_SUBJECT }}
        run: |
          ./scripts/verify-windows-signatures.ps1 `
            release/Aethon-VPN-*-Windows-x64-Installer.exe `
            release/Aethon-VPN-*-Windows-x64.msi `
            src-tauri/target/release/aether-gui.exe

      - name: Confirm the updater publisher pin matches the signature
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          PINNED: ${{ secrets.WINDOWS_PUBLISHER_NAME }}
          SIGNED_BY: ${{ steps.signing-gate.outputs.publisher }}
        run: |
          if (-not $env:PINNED) {
            throw 'WINDOWS_PUBLISHER_NAME is not set, so AETHON_UPDATE_PUBLISHER was not compiled into this build and the updater would accept any trusted publisher. Set it to the signing certificate common name.'
          }
          # Compared here rather than trusted, because the pin is baked in at compile time
          # and the signature is applied later: a mismatch would ship an updater that
          # refuses its own project's installers.
          if ($env:SIGNED_BY -and ($env:SIGNED_BY -notlike "*$($env:PINNED)*")) {
            throw "The artifacts are signed by `"$($env:SIGNED_BY)`" but AETHON_UPDATE_PUBLISHER was pinned to `"$($env:PINNED)`"."
          }
          Write-Host "Updater publisher pin: $($env:PINNED)"

      # actions/upload-artifact v4.6.2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Firstham-AetherGui-Windows-Android
          path: release/*
          if-no-files-found: error

  publish:
    # Split out so `contents: write` exists only for the step that needs it, and only on a
    # tag. `needs: build` means a failed signing gate stops publication.
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Require a signed Windows build
        run: |
          if [ "${{ needs.build.outputs.windows-signed }}" != "true" ]; then
            echo "RELEASE BLOCKED: the Windows signing gate did not pass." >&2
            exit 1
          fi
      # actions/download-artifact v4.3.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: Firstham-AetherGui-Windows-Android
          path: release
      # softprops/action-gh-release v2.6.2
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          generate_release_notes: true
          files: release/*
          body: |
            # Aethon VPN v2.1.1

            This is a stability and performance release of Aethon VPN.

            - Protocol-aware MTU so WARP-in-WARP no longer fragments at 1500
            - IPv6 tunnel routes are only advertised when the network actually carries IPv6
            - Repeated Connect taps no longer tear down and rebuild a healthy tunnel
            - VPN location is cached per exit IP and backs off on provider rate limits
            - Correct connection state on launch instead of a brief false "Disconnected"
            - Update checks are interval limited and use the latest-release endpoint
            - Update APKs are re-verified (SHA-256 and signing certificate) before install
            - Home screen widget toggles are restricted to this application
            - LAN SOCKS5 sharing now requires generated per-session credentials

            Security hardening in this release:

            - Android location lookups now verify the TLS hostname, not just the certificate chain
            - The Windows updater verifies the Authenticode publisher, not only the SHA-256
            - Release URLs are parsed and pinned rather than prefix-matched
            - The installer is held open across verification and launch, closing a swap window
            - A dead 457 KB library is no longer packaged into the MSI
            - CI actions are pinned to commit SHAs and workflow permissions are least-privilege

            The bundled Aether Core and Xray routing engine are fetched from official releases and SHA-256 verified during the build.
            Windows 10/11 x64 and Android 8.0+ are supported. Windows binaries and installers are Authenticode signed and timestamped; Android APKs are release-signed.
