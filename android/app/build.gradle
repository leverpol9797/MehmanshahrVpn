plugins { id 'com.android.application' }

// ---------------------------------------------------------------------------------
// LICENCE GATE — DEVELOPMENT ONLY. FLIP THIS BACK TO false BEFORE A REAL RELEASE.
//
//   -PlicenceGateDisabled=false
//
// True means every install is let through without a signed licence. It is a
// build-time constant read by AuthGate, which is the single place that decides, so
// there is no second path around it.
//
// It exists because testing a tunnel means uninstalling the previous build, and an
// uninstall takes the stored licence with it. Without this, every iteration means
// the whole purchase path again — mobile number, bot, one-time code, your manual
// approval — before the app will even connect, which makes it impossible to
// iterate on a chain that takes 120 seconds to fail.
//
// While this is true, any APK anyone downloads will run without paying. The
// licence Worker, the Rubika bot and the approval flow are untouched; only the
// app's refusal to start without a licence is switched off.
//
// The default is false, so a release enforces licensing. Testing a build still
// means reinstalling, and an uninstall takes the stored licence with it, so the
// flag is there for that: -PlicenceGateDisabled=true. Do not ship that.
// ---------------------------------------------------------------------------------
ext.licenceGateDisabled = project.hasProperty('licenceGateDisabled')
        ? project.property('licenceGateDisabled').toBoolean()
        : false

dependencies {
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'
    implementation 'androidx.work:work-runtime:2.10.0'
    implementation 'com.google.android.material:material:1.12.0'
    // Ed25519 verification for the signed license. Deliberately not BouncyCastle:
    // this library is small, has no provider-registration traps, and does the one
    // algorithm we need correctly. The app only ever verifies — it never signs.
    implementation 'net.i2p.crypto:eddsa:0.3.0'

    // The Psiphon tunnel core, as a vendored AAR built from the Shirokhorshid
    // fork — see .github/workflows/build-psiphon-aar.yml for why the stock
    // build cannot be used. fileTree rather than a direct file() so the build
    // still resolves on a tree that has not vendored the AAR yet.
    implementation fileTree(dir: 'libs', include: ['*.aar'])

    testImplementation 'junit:junit:4.13.2'
    // org.json is stubbed inside android.jar, so JVM unit tests need the real one
    testImplementation 'org.json:json:20231013'
}

def signingProperties = new Properties()
def signingPropertiesFile = rootProject.file('.android-signing/signing.properties')
if (signingPropertiesFile.exists()) signingPropertiesFile.withInputStream { signingProperties.load(it) }
def keystorePath = System.getenv('ANDROID_KEYSTORE_PATH') ?: signingProperties.getProperty('storeFile')
def keystorePassword = System.getenv('ANDROID_KEYSTORE_PASSWORD') ?: signingProperties.getProperty('storePassword')
def keyAliasName = System.getenv('ANDROID_KEY_ALIAS') ?: signingProperties.getProperty('keyAlias')
def keyPasswordValue = System.getenv('ANDROID_KEY_PASSWORD') ?: signingProperties.getProperty('keyPassword')
def releaseSigningAvailable = keystorePath && keystorePassword && keyAliasName && keyPasswordValue
def releaseRequested = gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') }

android {
    namespace 'com.firstham.aethergui'
    compileSdk 35

    defaultConfig {
        applicationId 'com.mehmanshahr.vpn'
        minSdk 26
        targetSdk 35
        versionCode 45
        versionName '2.5.2'
    }

    signingConfigs {
        release {
            if (releaseSigningAvailable) {
                storeFile rootProject.file(keystorePath)
                storePassword keystorePassword
                keyAlias keyAliasName
                keyPassword keyPasswordValue
            }
        }
    }

    buildTypes {
        release {
            if (releaseRequested && !releaseSigningAvailable) throw new GradleException('Release signing credentials are required. Unsigned release APKs are not allowed.')
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
            buildConfigField 'boolean', 'LICENCE_GATE_DISABLED', licenceGateDisabled.toString()
            logger.warn("LICENCE_GATE_DISABLED=${licenceGateDisabled} — every install is allowed through.")
        }
        debug {
            buildConfigField 'boolean', 'LICENCE_GATE_DISABLED', licenceGateDisabled.toString()
        }
    }

    packaging { jniLibs { useLegacyPackaging true } }
    buildFeatures { viewBinding true; buildConfig true }
    sourceSets { main { assets.srcDirs += ['../../third-party'] } }
    splits { abi { enable true; reset(); include 'armeabi-v7a', 'arm64-v8a'; universalApk true } }
}
