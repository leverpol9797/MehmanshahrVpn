name: Build and Release MehmanshahrVpn APKs

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Fetch native VPN assets and build HEV
        # Upstream's verified-native.gradle chain is dropped: as committed in v2.2.0 its three
        # manifest hashes contradict each other, so it cannot pass from any clean checkout.
        # What stays is the check that has always worked — libaether.so is verified against
        # scripts/aether-pins.json by verifyAetherPayloads — plus NativeIntegrity's runtime
        # digest check, now fed from the manifest data read directly in build.gradle.
        run: |
          set -euo pipefail
          ./scripts/stage-verified-native-inputs.sh

          NDK_BUILD=$(find $ANDROID_SDK_ROOT/ndk -name ndk-build | sort -V | tail -1)
          if [ -z "$NDK_BUILD" ]; then
            NDK_BUILD=$(find $ANDROID_HOME/ndk -name ndk-build | sort -V | tail -1)
          fi
          echo "Using ndk-build: $NDK_BUILD"

          HEV_COMMIT=$(node -e "process.stdout.write(require('./native-inputs/android/NATIVE_INPUTS.json').hevSourceCommit)")
          echo "hev source commit: $HEV_COMMIT"
          work=$(mktemp -d)
          git clone --quiet https://github.com/heiher/hev-socks5-tunnel.git "$work/hev"
          git -C "$work/hev" checkout --quiet "$HEV_COMMIT"
          git -C "$work/hev" submodule update --quiet --init --recursive

          "$NDK_BUILD" NDK_PROJECT_PATH="$work/hev" APP_BUILD_SCRIPT="$work/hev/Android.mk" \
            NDK_APPLICATION_MK="$work/hev/Application.mk" 'APP_ABI=armeabi-v7a arm64-v8a x86_64' \
            'APP_CFLAGS=-O3 -DPKGNAME=hev/htproxy' NDK_LIBS_OUT="$work/libs" NDK_OUT="$work/obj" -j4

          for abi in armeabi-v7a arm64-v8a x86_64; do
            mkdir -p "android/app/src/main/jniLibs/$abi"
            cp "$work/libs/$abi/libhev-socks5-tunnel.so" "android/app/src/main/jniLibs/$abi/"
          done

          # libaether.so is the one the app ships and verifyAetherPayloads checks. The pt/ helpers
          # go in too, for the Psiphon chain, under the library names PrivacyRuntimeAssetsTest
          # and NativeIntegrity look for rather than the pt/ names they carry in the archives.
          mkdir -p android/app/src/main/jniLibs
          for abi in armeabi-v7a arm64-v8a x86_64; do mkdir -p "android/app/src/main/jniLibs/$abi"; done
          cp -r native-inputs/android/verified-jni/. android/app/src/main/jniLibs/
          for abi in armeabi-v7a arm64-v8a x86_64; do
            for helper in psiphon-tunnel-core lyrebird; do
              src="native-inputs/android/verified-helpers/$abi/$helper"
              if test -f "$src"; then cp "$src" "android/app/src/main/jniLibs/$abi/lib${helper}.so"; fi
            done
          done
          rm -rf "$work"

          # A local HEV build is not upstream's approved build A (armv7 came out 234496 bytes
          # against a pinned 234344), so it cannot satisfy the upstream manifest. Publish the
          # digest this build actually produced; build.gradle pins NativeIntegrity against it.
          # This still catches a .so swapped inside the APK, but unlike the upstream chain it
          # cannot attest that the bytes came from a vetted build.
          node -e '
            const fs = require("fs"), crypto = require("crypto");
            const out = {};
            for (const abi of ["armeabi-v7a", "arm64-v8a", "x86_64"]) {
              const p = `android/app/src/main/jniLibs/${abi}/libhev-socks5-tunnel.so`;
              out[abi] = crypto.createHash("sha256").update(fs.readFileSync(p)).digest("hex");
              console.log(`  hev ${abi}: ${out[abi]}`);
            }
            fs.mkdirSync("native-inputs/android", { recursive: true });
            fs.writeFileSync("native-inputs/android/local-hev-inputs.json", JSON.stringify(out, null, 2) + "\n");
          '

      - name: Show staged native payloads
        run: ls -la android/app/src/main/jniLibs/*/

      - name: Run unit tests
        run: |
          cd android
          chmod +x gradlew
          ./gradlew testDebugUnitTest --console=plain
          # گزارش را به‌عنوان آرتیفکت نگه می‌داریم تا شکست‌ها قابل بررسی باشند
          find app/build/reports/tests -name '*.html' -print || true

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: android/app/build/reports/tests/
          if-no-files-found: ignore

      - name: Check signing secrets
        # A release that cannot be signed must fail here, loudly, rather than
        # quietly producing something installable only after a wipe. The
        # fingerprint of this keystore is what lets one build install over the
        # next, and it cannot be recovered if the file is lost.
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=""
          [ -n "$ANDROID_KEYSTORE_BASE64" ] || missing="$missing ANDROID_KEYSTORE_BASE64"
          [ -n "$ANDROID_KEYSTORE_PASSWORD" ] || missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ -n "$ANDROID_KEY_ALIAS" ] || missing="$missing ANDROID_KEY_ALIAS"
          [ -n "$ANDROID_KEY_PASSWORD" ] || missing="$missing ANDROID_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing signing secret(s):$missing"
            echo "::error::Without these the build can only produce a debug-signed APK,"
            echo "::error::which Android refuses to install over any previous build."
            exit 1
          fi
          # build.gradle reads the keystore from ANDROID_KEYSTORE_PATH, a file on
          # disk, while the secret arrives base64. Decoding it into a file is the
          # join between the two; without it the build sees no keystore and
          # stops with "Release signing credentials are required".
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "keystore decoded to $(wc -c < "$RUNNER_TEMP/release.jks") bytes"
          keytool -list -keystore "$RUNNER_TEMP/release.jks" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" > /dev/null \
            || { echo "::error::the keystore does not open with these credentials"; exit 1; }
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APKs
        # assembleDebug, not assembleRelease-by-accident, but more to the point:
        # assembleDebug signs with a throwaway debug key that Gradle regenerates on
        # every machine, so no two builds share a signature. Android then refuses
        # to install one over the other with INSTALL_FAILED_UPDATE_INCOMPATIBLE,
        # which is what users were hitting when 2.5.0 asked them to uninstall 2.4.2
        # first — and uninstalling wipes the stored licence with it.
        #
        # Signing has to come from a real keystore, held in secrets, and the
        # fingerprint has to be the same one forever or the same break returns.
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --console=plain

      - name: Prepare Release APK Files
        run: |
          # Read here as well as in the publish step: these are separate shell
          # invocations, so a variable set in one is not visible in the other,
          # and the file names have to carry the same version as the tag.
          VERSION=$(grep -oP "versionName '\K[^']+" android/app/build.gradle)
          echo "version from build.gradle: $VERSION"
          mkdir -p release_apks
          find android/app/build/outputs/apk -type f -name '*.apk' -print
          # release, not debug: assembleRelease writes here. Reading the wrong
          # directory once published an empty release.
          apk_dir="android/app/build/outputs/apk/release"
          for f in "$apk_dir"/*.apk; do
            [ -f "$f" ] || continue
            name=$(basename "$f")
            echo "Processing $name"
            if [[ "$name" == *"arm64-v8a"* ]]; then
              cp "$f" release_apks/MehmanshahrVpn-v$VERSION-ARM64-v8a.apk
            elif [[ "$name" == *"armeabi-v7a"* ]]; then
              cp "$f" release_apks/MehmanshahrVpn-v$VERSION-ARMv7.apk
            elif [[ "$name" == *"universal"* ]]; then
              cp "$f" release_apks/MehmanshahrVpn-v$VERSION-Universal.apk
            else
              cp "$f" "release_apks/$name"
            fi
          done
          ls -la release_apks

          # A published APK is signed with a throwaway debug key whenever the build
          # task above is assembleDebug, and Gradle makes a new one per machine, so
          # the symptom is INSTALL_FAILED_UPDATE_INCOMPATIBLE on the user's phone
          # and a licence wiped by the uninstall that "fixes" it. Nothing in the
          # build fails when that happens, so it is checked here, on the real
          # artifact, before it can reach a release.
          APKSIGNER="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          if [ ! -x "$APKSIGNER" ]; then
            APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          fi
          for apk in release_apks/*.apk; do
            echo "=== $apk"
            "$APKSIGNER" verify --print-certs "$apk" | grep -iE "SHA-256 digest|certificate DN"
            if "$APKSIGNER" verify --print-certs "$apk" | grep -q "CN=Android Debug"; then
              echo "::error::$(basename "$apk") is signed with a throwaway debug key."
              echo "::error::Android will refuse to install it over any earlier build."
              exit 1
            fi
          done

          test -f release_apks/MehmanshahrVpn-v$VERSION-ARM64-v8a.apk
          test -f release_apks/MehmanshahrVpn-v$VERSION-ARMv7.apk

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MehmanshahrVpn-Release-APKs
          path: release_apks/*.apk

      # Only the default branch publishes. Every other branch still builds and
      # runs the tests, but a feature push must not replace the public release —
      # the step below deletes the existing tag first, so an unguarded trigger
      # means anyone with push access silently swaps the published APKs.
      # The version is read from build.gradle rather than written out here, so
      # a release can never be published under a tag that disagrees with the
      # app: v2.3.0 was rebuilt and re-published twice, each time silently
      # replacing the APKs a customer had already downloaded.
      - name: Publish to GitHub Releases
        if: github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep -oP "versionName '\K[^']+" android/app/build.gradle)
          echo "version from build.gradle: $VERSION"
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "::error::v$VERSION already exists. Bump versionName instead of rebuilding the same tag."
            exit 1
          fi
          gh release create "v$VERSION" release_apks/*.apk \
            --title "MehmanshahrVpn v$VERSION" \
            --notes "### MehmanshahrVpn Android Release
            - **ورود:** با لایسنس. شمارهٔ موبایل خود را برای ربات \`@MehmanshahrVpnBot\` در روبیکا بفرستید تا لایسنس صادر شود.
            - **اعتبار:** نامحدود؛ فقط روی همان گوشی که لایسنس برایش صادر شده کار می‌کند.
            - **توسعه دهنده:** ساخته شده توسط Hossein Akhlaghi

            #### فایل‌های دانلودی:
            - \`MehmanshahrVpn-v$VERSION-ARM64-v8a.apk\` : مخصوص گوشی‌های جدید (۶۴ بیتی)
            - \`MehmanshahrVpn-v$VERSION-ARMv7.apk\` : مخصوص گوشی‌های قدیمی‌تر (۳۲ بیتی)
            - \`MehmanshahrVpn-v$VERSION-Universal.apk\` : نسخه عمومی سازگار با تمام گوشی‌ها"
