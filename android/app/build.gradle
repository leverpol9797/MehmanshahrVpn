plugins { id 'com.android.application' }

// ---------------------------------------------------------------------------------
// LICENCE GATE — DEVELOPMENT ONLY. FLIP THIS BACK TO false BEFORE A REAL RELEASE.
//
//   -PlicenceGateDisabled=false
//
// True means every install is let through without a signed licence. It is a
// build-time constant read by AuthGate, which is the single place that decides, so
// there is no second path around it.
//
// It exists because testing a tunnel means uninstalling the previous build, and an
// uninstall takes the stored licence with it. Without this, every iteration means
// the whole purchase path again — mobile number, bot, one-time code, your manual
// approval — before the app will even connect, which makes it impossible to
// iterate on a chain that takes 120 seconds to fail.
//
// While this is true, any APK anyone downloads will run without paying. The
// licence Worker, the Rubika bot and the approval flow are untouched; only the
// app's refusal to start without a licence is switched off.
//
// The default is false, so a release enforces licensing. Testing a build still
// means reinstalling, and an uninstall takes the stored licence with it, so the
// flag is there for that: -PlicenceGateDisabled=true. Do not ship that.
// ---------------------------------------------------------------------------------
ext.licenceGateDisabled = project.hasProperty('licenceGateDisabled')
        ? project.property('licenceGateDisabled').toBoolean()
        : false

// ---- Synced from upstream v2.2.0: core pins and build-run identifiers ----
def corePins = new groovy.json.JsonSlurper().parse(rootProject.file('../scripts/aether-pins.json')).android
def codexBuild = providers.gradleProperty('codexBuild').orNull
if (codexBuild && !(codexBuild ==~ /codex\.[0-9]{3,}/)) throw new GradleException('Invalid Codex build identifier')
if (codexBuild) layout.buildDirectory.set(file("build-codex/${codexBuild}"))
def developmentBuild = providers.gradleProperty('developmentBuild').orNull
if (developmentBuild) {
    if (!(developmentBuild ==~ /dev\.[0-9]{3,}/) || codexBuild) throw new GradleException('Invalid or conflicting development build identifier')
    layout.buildDirectory.set(file("build-dev/${developmentBuild}"))
}
if (providers.gradleProperty('codexNativeDir').isPresent()) throw new GradleException('Native overrides are disabled; use the approved Phase 1 input chain')
def verificationRun = providers.gradleProperty('verificationRun').orNull
if (verificationRun) {
    if (developmentBuild || codexBuild) throw new GradleException('Verification and candidate builds must be separate')
    if (!(verificationRun ==~ /phase2-[0-9]{8}-[0-9]{3}/)) throw new GradleException('Invalid verification identifier')
    if (gradle.startParameter.taskNames.any { it.toLowerCase() == 'build' || it.toLowerCase().matches('.*(assemble|bundle|install|package|publish|release).*') })
        throw new GradleException('Verification runs cannot package, install or publish applications')
    layout.buildDirectory.set(rootProject.file("../validation/${verificationRun}/android-gradle"))
}
def nativeInput = layout.buildDirectory.dir('verified-jni').get().asFile.absolutePath

dependencies {
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'
    implementation 'androidx.work:work-runtime:2.10.0'
    implementation 'com.google.android.material:material:1.12.0'
    // Ed25519 verification for the signed license. Deliberately not BouncyCastle:
    // this library is small, has no provider-registration traps, and does the one
    // algorithm we need correctly. The app only ever verifies — it never signs.
    implementation 'net.i2p.crypto:eddsa:0.3.0'

    // The Psiphon tunnel core, as a vendored AAR built from the Shirokhorshid
    // fork — see .github/workflows/build-psiphon-aar.yml for why the stock
    // build cannot be used. fileTree rather than a direct file() so the build
    // still resolves on a tree that has not vendored the AAR yet.
    implementation fileTree(dir: 'libs', include: ['*.aar'])

    testImplementation 'junit:junit:4.13.2'
    // org.json is stubbed inside android.jar, so JVM unit tests need the real one
    testImplementation 'org.json:json:20231013'
}

def signingProperties = new Properties()
def signingPropertiesFile = rootProject.file('.android-signing/signing.properties')
if (signingPropertiesFile.exists()) signingPropertiesFile.withInputStream { signingProperties.load(it) }
def keystorePath = System.getenv('ANDROID_KEYSTORE_PATH') ?: signingProperties.getProperty('storeFile')
def keystorePassword = System.getenv('ANDROID_KEYSTORE_PASSWORD') ?: signingProperties.getProperty('storePassword')
def keyAliasName = System.getenv('ANDROID_KEY_ALIAS') ?: signingProperties.getProperty('keyAlias')
def keyPasswordValue = System.getenv('ANDROID_KEY_PASSWORD') ?: signingProperties.getProperty('keyPassword')
def releaseSigningAvailable = keystorePath && keystorePassword && keyAliasName && keyPasswordValue
def releaseRequested = gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') }

android {
    namespace 'com.firstham.aethergui'
    compileSdk 35

    defaultConfig {
        applicationId 'com.mehmanshahr.vpn'
        minSdk 26
        targetSdk 35
versionCode 46
        versionName '2.5.3'
        buildConfigField 'String', 'AETHER_VERSION', '"' + corePins.version + '"'
        buildConfigField 'String', 'AETHER_ARM64_SHA256', '"' + corePins.binary['aether-android-arm64.tar.gz'] + '"'
        buildConfigField 'String', 'AETHER_ARMV7_SHA256', '"' + corePins.binary['aether-android-armv7.tar.gz'] + '"'
        buildConfigField 'String', 'AETHER_X86_64_SHA256', '"' + corePins.binary['aether-android-x86_64.tar.gz'] + '"'
    }

    signingConfigs {
        release {
            if (releaseSigningAvailable) {
                storeFile rootProject.file(keystorePath)
                storePassword keystorePassword
                keyAlias keyAliasName
                keyPassword keyPasswordValue
            }
        }
    }

    buildTypes {
        debug {
            if (codexBuild) throw new GradleException('Codex development suffixes are not valid for the canonical v2.2.0 project')
            if (developmentBuild) throw new GradleException('Development build suffixes are not valid for the canonical v2.2.0 project')
        }
        release {
            if (releaseRequested && !releaseSigningAvailable) throw new GradleException('Release signing credentials are required. Unsigned release APKs are not allowed.')
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
            buildConfigField 'boolean', 'LICENCE_GATE_DISABLED', licenceGateDisabled.toString()
            logger.warn("LICENCE_GATE_DISABLED=${licenceGateDisabled} — every install is allowed through.")
        }
        debug {
            buildConfigField 'boolean', 'LICENCE_GATE_DISABLED', licenceGateDisabled.toString()
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
            keepDebugSymbols += ['**/libaether.so', '**/libhev-socks5-tunnel.so', '**/libpsiphon-tunnel-core.so', '**/liblyrebird.so']
        }
    }
    buildFeatures { viewBinding true; buildConfig true }
    sourceSets { main { assets.srcDirs += ['../../third-party'] } }
if (nativeInput) sourceSets.main.jniLibs.srcDirs = [file(nativeInput)]
    splits { abi { enable true; reset(); include 'armeabi-v7a', 'arm64-v8a', 'x86_64'; universalApk true } }
}

tasks.register('verifyAetherPayloads') {
    doLast {
        if (corePins.version != 'v2.3.0') throw new GradleException('Expected Aether Core v2.3.0')
        ['arm64-v8a':'arm64', 'armeabi-v7a':'armv7', 'x86_64':'x86_64'].each { abi, target ->
            def payload = new File(nativeInput ? file(nativeInput) : file('src/main/jniLibs'), "${abi}/libaether.so")
            if (!payload.isFile()) throw new GradleException("Missing Aether payload for ${abi}")
            def bytes = payload.bytes
            def expectedMachine = [arm64:183, armv7:40, x86_64:62][target]
            if (bytes.length < 20 || bytes[0] != 127 || bytes[1] != 69 || bytes[2] != 76 || bytes[3] != 70
                    || bytes[4] != (target == 'armv7' ? 1 : 2) || bytes[5] != 1
                    || ((bytes[18] & 255) | ((bytes[19] & 255) << 8)) != expectedMachine)
                throw new GradleException("Invalid Aether ELF architecture for ${abi}")
            def digest = java.security.MessageDigest.getInstance('SHA-256').digest(bytes).encodeHex().toString()
            if (digest != corePins.binary["aether-android-${target}.tar.gz"])
                throw new GradleException("Aether SHA-256 mismatch for ${abi}")
        }
    }
}
tasks.named('preBuild').configure { dependsOn 'verifyAetherPayloads' }
apply from: rootProject.file('verified-native.gradle')
