name: Unit Tests

# Unit tests are plain JVM code — they do not need the native Aether core, the
# HEV tunnel library, or the NDK. Fetching those turns a 90-second test run
# into a ten-minute one, which is the wrong trade while iterating on a change.
# The full build in build-android.yml still runs them before assembling.

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Run unit tests
        run: |
          cd android
          chmod +x gradlew
          ./gradlew testDebugUnitTest --console=plain

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: android/app/build/reports/tests/
          if-no-files-found: ignore
